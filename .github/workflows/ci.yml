name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  AI_CORE_ONNXRUNTIME_VERSION: 1.20.1

jobs:
  source-quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format 21
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 21
          sudo apt-get install -y clang-format-21
      - name: Check formatting
        run: |
          git ls-files '*.hpp' '*.cpp' '*.cc' '*.cu' \
            | xargs -r clang-format-21 --dry-run --Werror
      - name: Check release version
        run: |
          header=include/ai_core/version.hpp
          major=$(grep -oP 'AI_CORE_VER_MAJOR \K[0-9]+' "${header}")
          minor=$(grep -oP 'AI_CORE_VER_MINOR \K[0-9]+' "${header}")
          patch=$(grep -oP 'AI_CORE_VER_PATCH \K[0-9]+' "${header}")
          latest=$(grep -oP '^## v\K[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | head -1)
          test "${major}.${minor}.${patch}" = "${latest}"

  core-zero-deps:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Configure core without submodules
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake --preset core
      - run: cmake --build --preset core
      - name: Verify core runtime dependency allowlist
        run: scripts/verify_core_runtime.sh build/core/x86_64/lib/libai_core.so
      - name: Verify installed package consumer
        run: |
          cmake --install build/core --prefix install/core
          cmake -S tests/package-consumer -B build/package-consumer -G Ninja \
            -DCMAKE_PREFIX_PATH=$PWD/install/core
          cmake --build build/package-consumer

  component-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: core-tests
            profiles: testing
          - preset: config-tests
            profiles: config testing
          - preset: vision-tests
            profiles: vision testing
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Initialize profile dependencies
        run: scripts/deps.sh init ${{ matrix.profiles }}
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}

  onnxruntime-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: true
      - name: Install OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y libopencv-dev
      - name: Cache ONNX Runtime
        uses: actions/cache@v4
        with:
          path: .deps/Linux_x86_64/onnxruntime
          key: onnxruntime-linux-x64-${{ env.AI_CORE_ONNXRUNTIME_VERSION }}
      - name: Initialize profile dependencies
        run: scripts/deps.sh init config onnxruntime testing
      - run: cmake --preset developer
      - run: cmake --build --preset developer
      - run: ctest --preset developer

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install coverage tool
        run: sudo apt-get update && sudo apt-get install -y gcovr
      - run: scripts/coverage.sh 80
